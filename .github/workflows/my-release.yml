# Builds the Windows installer in the cloud and publishes it to my-modrinth-releases,
# so friends' apps auto-update. Same steps as make-update.ps1.
#
# Release from any computer:   git tag app-v1.0.3 && git push origin app-v1.0.3
# (or Actions tab -> "My release" -> Run workflow, and type the version)
#
# One-time setup, in this repo's Settings -> Secrets and variables -> Actions:
#   TAURI_PRIVATE_KEY    contents of myapp.key
#   TAURI_KEY_PASSWORD   its password (leave empty if it has none)
#   RELEASES_TOKEN       a token that can create releases in my-modrinth-releases
name: My release

on:
  push:
    tags:
      - 'app-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.0.3), must be higher than the last release'
        required: true

env:
  RELEASES_REPO: maildeguiguinoidea-hue/my-modrinth-releases

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 150
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Work out the version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
          HAS_KEY: ${{ secrets.TAURI_PRIVATE_KEY != '' }}
          HAS_TOKEN: ${{ secrets.RELEASES_TOKEN != '' }}
        run: |
          VERSION="$INPUT_VERSION"
          [ -z "$VERSION" ] && VERSION="${GITHUB_REF_NAME#app-v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::'$VERSION' isn't a version like 1.0.3"; exit 1
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "NOTES=$(git log -1 --format=%s)" >> "$GITHUB_ENV"
          [ -f apps/app/tauri-myrelease.conf.json ] || { echo "::error::apps/app/tauri-myrelease.conf.json is missing, commit it from the Windows PC"; exit 1; }
          [ "$HAS_KEY" = true ] || { echo "::error::The TAURI_PRIVATE_KEY secret isn't set"; exit 1; }
          [ "$HAS_TOKEN" = true ] || { echo "::error::The RELEASES_TOKEN secret isn't set"; exit 1; }

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set version and load .env
        shell: bash
        run: |
          corepack enable
          node -e "const f='apps/app-frontend/package.json',p=require('./'+f);p.version=process.env.VERSION;require('fs').writeFileSync(f,JSON.stringify(p,null,'\t')+'\n')"
          cp packages/app-lib/.env.prod packages/app-lib/.env
          grep -E '^[A-Za-z_][A-Za-z0-9_]*=' packages/app-lib/.env | sed -E 's/="?([^"]*)"?$/=\1/' >> "$GITHUB_ENV"

      - name: Install packages
        run: pnpm install

      - name: Build and sign the installer
        working-directory: apps/app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}
          CARGO_PROFILE_RELEASE_LTO: thin
        run: |
          pnpm -w i18n:coverage
          pnpm tauri build --bundles nsis --config tauri-myrelease.conf.json

      - name: Write latest.json
        shell: bash
        run: |
          cd target/release/bundle/nsis
          EXE="$(ls -t *_${VERSION}_x64-setup.exe | head -1)"
          # No spaces in the uploaded name, so the download link is predictable
          ASSET="$(echo "$EXE" | tr ' ' '.')"
          [ "$EXE" != "$ASSET" ] && mv "$EXE" "$ASSET" && mv "$EXE.sig" "$ASSET.sig"
          node -e "
            const fs = require('fs')
            fs.writeFileSync('latest.json', JSON.stringify({
              version: process.env.VERSION,
              notes: process.env.NOTES,
              pub_date: new Date().toISOString().replace(/\.\d+Z$/, 'Z'),
              platforms: { 'windows-x86_64': {
                signature: fs.readFileSync('$ASSET.sig', 'utf8').trim(),
                url: 'https://github.com/${RELEASES_REPO}/releases/download/v${VERSION}/$ASSET',
              } },
            }, null, 2))
          "
          cat latest.json
          echo "ASSET_PATH=target/release/bundle/nsis/$ASSET" >> "$GITHUB_ENV"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          repository: ${{ env.RELEASES_REPO }}
          token: ${{ secrets.RELEASES_TOKEN }}
          tag_name: v${{ env.VERSION }}
          name: v${{ env.VERSION }}
          body: ${{ env.NOTES }}
          files: |
            ${{ env.ASSET_PATH }}
            target/release/bundle/nsis/latest.json
